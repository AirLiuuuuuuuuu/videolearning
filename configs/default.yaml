# Initial settings for the "watch and listen" preprocessing stage.
# These are safe defaults; adjust them when we select concrete models.
project:
  data_dir: data

preprocess:
  extract_audio: true
  sample_frames: true
  frame_interval_seconds: 5
  language: zh
  audio_sample_rate: 16000
  whisper_model: base

# `base` is a reasonable first local model. Increase to `small` later for
# better accuracy at the cost of slower processing and a larger download.

output:
  save_transcript: true
  save_ocr: true
  save_metadata: true
