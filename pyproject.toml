[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videolearn-demo"
version = "0.1.0"
description = "VideoLearn Demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "imageio-ffmpeg>=0.6.0",
  "openai-whisper",
  "opencv-python>=4.10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
